<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FinnTV Universal Legacy Player</title>
    <style>
        /* Modern-looking premium CSS constructed entirely with legacy-safe rules (No Flexbox, No Grid) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-box-sizing: border-box;
            -moz-box-sizing: border-box;
        }
        
        body {
            background-color: #0b0d19;
            color: #f1f3f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding-bottom: 40px;
        }

        /* Top Header Bar */
        .top-navbar {
            background-color: #121526;
            border-bottom: 2px solid #1f2544;
            padding: 15px 20px;
            clear: both;
        }
        .navbar-brand {
            float: left;
            font-size: 22px;
            font-weight: 800;
            color: #00a8ff;
            text-decoration: none;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .settings-inline {
            float: right;
            margin-top: 4px;
        }
        .settings-label {
            font-size: 14px;
            color: #a0aec0;
            cursor: pointer;
        }
        .settings-checkbox {
            width: 18px;
            height: 18px;
            vertical-align: middle;
            margin-right: 6px;
        }
        .clear-fix {
            clear: both;
        }

        /* Video Container - Responsive Aspect Ratio */
        .video-container {
            width: 100%;
            background-color: #020205;
            border-bottom: 3px solid #00a8ff;
            text-align: center;
            position: relative;
        }
        video {
            width: 100%;
            max-width: 800px;
            max-height: 450px;
            background-color: #000;
            display: inline-block;
            vertical-align: middle;
        }

        /* Categories Bar - Horizontal scroll using inline-block */
        .categories-container {
            background-color: #121526;
            border-bottom: 1px solid #1f2544;
            padding: 10px;
            white-space: nowrap;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .category-tab {
            display: inline-block;
            background-color: #1c2035;
            color: #e2e8f0;
            text-decoration: none;
            padding: 10px 18px;
            margin-right: 8px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            border: 1px solid #2d3250;
        }
        .category-tab.active {
            background-color: #00a8ff;
            color: #ffffff;
            border-color: #00c0ff;
        }

        /* Search & Controls Block */
        .controls-wrapper {
            padding: 20px 15px 10px 15px;
            text-align: center;
        }
        .search-field {
            width: 100%;
            max-width: 500px;
            padding: 12px 16px;
            font-size: 16px;
            background-color: #121526;
            color: #ffffff;
            border: 2px solid #2d3250;
            border-radius: 8px;
            outline: none;
            margin-bottom: 15px;
        }
        .search-field:focus {
            border-color: #00a8ff;
        }

        /* Pagination Controls */
        .pagination-container {
            display: block;
            margin: 10px 0;
            text-align: center;
        }
        .page-button {
            display: inline-block;
            background-color: #1c2035;
            color: #ffffff;
            border: 1px solid #2d3250;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 6px;
            margin: 0 8px;
            cursor: pointer;
            text-decoration: none;
            vertical-align: middle;
        }
        .page-button:active {
            background-color: #00a8ff;
        }
        .page-button:disabled {
            background-color: #0d0f19;
            color: #4a5568;
            border-color: #1f2544;
            cursor: default;
        }
        .page-label {
            display: inline-block;
            font-size: 14px;
            color: #a0aec0;
            margin: 10px 0;
            vertical-align: middle;
        }

        /* Premium Card Grid - Constructed with legacy float layouts (Fully responsive) */
        .grid-wrapper {
            padding: 10px;
            clear: both;
        }
        .channel-card-container {
            width: 50%; /* 2 cards per row on mobile */
            float: left;
            padding: 6px;
        }
        @media (min-width: 600px) {
            .channel-card-container {
                width: 33.33%; /* 3 cards per row on tablets/Vita */
            }
        }
        @media (min-width: 900px) {
            .channel-card-container {
                width: 25%; /* 4 cards per row on desktops */
            }
        }
        .channel-card {
            background-color: #121526;
            border: 1px solid #1f2544;
            border-radius: 8px;
            padding: 18px 12px;
            text-align: center;
            cursor: pointer;
            min-height: 80px;
            display: block;
            text-decoration: none;
            color: #f1f3f9;
        }
        .channel-card:active {
            background-color: #1c2035;
            border-color: #00a8ff;
        }
        .channel-name {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.4;
            word-wrap: break-word;
        }

        /* Status / Loader text */
        .loader-text {
            text-align: center;
            padding: 40px;
            color: #718096;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- Header bar -->
    <div class="top-navbar">
        <a href="#" class="navbar-brand">FinnTV</a>
        <div class="settings-inline">
            <label class="settings-label">
                <input type="checkbox" id="direct-play-toggle" class="settings-checkbox"> 
                Force Direct Play
            </label>
        </div>
        <div class="clear-fix"></div>
    </div>

    <!-- Video Area -->
    <div class="video-container">
        <video id="video-player" controls preload="none" playsinline webkit-playsinline poster="assets/poster.png"></video>
    </div>

    <!-- Category selector -->
    <div class="categories-container">
        <a href="old.html?m3u=m3u/world.m3u" class="category-tab" id="btn-world">World</a>
        <a href="old.html?m3u=m3u/india.m3u" class="category-tab" id="btn-india">India</a>
        <a href="old.html?m3u=m3u/sport.m3u" class="category-tab" id="btn-sport">Sports</a>
        <a href="old.html?m3u=m3u/egypt.m3u" class="category-tab" id="btn-egypt">Egypt</a>
        <a href="old.html?m3u=m3u/asia.m3u" class="category-tab" id="btn-asia">Asia</a>
        <a href="old.html?m3u=m3u/spanish.m3u" class="category-tab" id="btn-spanish">Spain</a>
    </div>

    <!-- Search box & pagination -->
    <div class="controls-wrapper">
        <input type="text" id="search-input" class="search-field" placeholder="Search channels..." onkeyup="handleSearch()">
        
        <div class="pagination-container">
            <button id="btn-prev" class="page-button" onclick="prevPage()">&#9664; Prev</button>
            <span class="page-label" id="page-info">Page 1 of 1</span>
            <button id="btn-next" class="page-button" onclick="nextPage()">Next &#9654;</button>
        </div>
    </div>

    <!-- Channels Grid -->
    <div class="grid-wrapper" id="channel-grid">
        <div class="loader-text">Select a category above to load TV channels.</div>
    </div>
    <div class="clear-fix"></div>

    <script>
        // STRICT ES5 COMPATIBILITY FOR LEGACY ENGINES (iOS 6+, Android 4+, Vita, Blackberry)
        var player = document.getElementById('video-player');
        var channelGrid = document.getElementById('channel-grid');
        var pageInfo = document.getElementById('page-info');
        var btnPrev = document.getElementById('btn-prev');
        var btnNext = document.getElementById('btn-next');
        var searchInput = document.getElementById('search-input');
        
        var allChannels = [];
        var filteredChannels = [];
        var currentPage = 1;
        var itemsPerPage = 48; // Must be divisible by 2, 3, and 4 for perfect grid fitting

        function getQueryParam(name) {
            var match = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
            return match && decodeURIComponent(match[1].replace(/\+/g, ' '));
        }

        function encodeBase64(str) {
            try {
                if (typeof window.btoa === 'function') {
                    return window.btoa(unescape(encodeURIComponent(str)));
                }
            } catch (e) {}
            return str;
        }

        function playChannel(url) {
            var useDirect = document.getElementById('direct-play-toggle').checked;
            var finalUrl;
            
            if (useDirect) {
                finalUrl = url.replace('https://', 'http://');
            } else {
                finalUrl = 'api/stream_proxy.php?url=' + encodeURIComponent(encodeBase64(url));
            }
            
            player.src = finalUrl;
            player.load();
            player.play();
            
            // Scroll to video tag
            window.scrollTo(0, 0);
        }

        function handleSearch() {
            var query = searchInput.value.toLowerCase();
            filteredChannels = [];
            for (var i = 0; i < allChannels.length; i++) {
                if (allChannels[i].name.toLowerCase().indexOf(query) !== -1) {
                    filteredChannels.push(allChannels[i]);
                }
            }
            currentPage = 1;
            renderPage();
        }

        function nextPage() {
            if ((currentPage * itemsPerPage) < filteredChannels.length) {
                currentPage++;
                renderPage();
            }
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderPage();
            }
        }

        function renderPage() {
            channelGrid.innerHTML = '';
            
            if (filteredChannels.length === 0) {
                channelGrid.innerHTML = '<div class="loader-text">No channels match your search.</div>';
                pageInfo.innerHTML = 'Page 1 of 1';
                btnPrev.disabled = true;
                btnNext.disabled = true;
                return;
            }

            var totalPages = Math.ceil(filteredChannels.length / itemsPerPage);
            pageInfo.innerHTML = 'Page ' + currentPage + ' of ' + totalPages;
            
            btnPrev.disabled = (currentPage === 1);
            btnNext.disabled = (currentPage === totalPages);

            var startIndex = (currentPage - 1) * itemsPerPage;
            var endIndex = startIndex + itemsPerPage;
            if (endIndex > filteredChannels.length) endIndex = filteredChannels.length;

            for (var i = startIndex; i < endIndex; i++) {
                var c = filteredChannels[i];
                
                var cardContainer = document.createElement('div');
                cardContainer.className = 'channel-card-container';
                
                var card = document.createElement('div');
                card.className = 'channel-card';
                
                var nameSpan = document.createElement('div');
                nameSpan.className = 'channel-name';
                nameSpan.innerHTML = c.name;
                
                card.appendChild(nameSpan);
                cardContainer.appendChild(card);
                
                // ES5 Closure scope binding for click callback
                (function(url) {
                    card.onclick = function() {
                        playChannel(url);
                    };
                })(c.url);

                channelGrid.appendChild(cardContainer);
            }
            
            // Add a final clear-fix to prevent float breaking
            var clearDiv = document.createElement('div');
            clearDiv.className = 'clear-fix';
            channelGrid.appendChild(clearDiv);
        }

        function parseM3U(data) {
            var lines = data.replace(/\r/g, '').split('\n');
            var channels = [];
            var currentName = 'Unknown Channel';

            for (var i = 0; i < lines.length; i++) {
                var line = lines[i];
                if (line.indexOf('#EXTINF:') === 0) {
                    var parts = line.split(',');
                    if (parts.length > 1) {
                        currentName = parts.slice(1).join(',').replace(/^\s+|\s+$/g, '');
                    }
                } else if (line !== '' && line.indexOf('#') !== 0) {
                    channels.push({
                        name: currentName,
                        url: line.replace(/^\s+|\s+$/g, '')
                    });
                    currentName = 'Unknown Channel';
                }
            }
            return channels;
        }

        function highlightActiveMenu(url) {
            var buttons = document.getElementsByClassName('category-tab');
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].className = 'category-tab';
                if (url && buttons[i].href.indexOf(url) !== -1) {
                    buttons[i].className = 'category-tab active';
                }
            }
        }

        function loadM3U(url) {
            channelGrid.innerHTML = '<div class="loader-text">Downloading IPTV playlist...</div>';
            highlightActiveMenu(url);
            
            var xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200 || xhr.status === 0) {
                        if (xhr.responseText) {
                            allChannels = parseM3U(xhr.responseText);
                            filteredChannels = [].concat(allChannels);
                            currentPage = 1;
                            renderPage();
                            if (allChannels.length > 0) {
                                playChannel(allChannels[0].url);
                            }
                        } else {
                            channelGrid.innerHTML = '<div class="loader-text">Received empty channel list.</div>';
                        }
                    } else {
                        channelGrid.innerHTML = '<div class="loader-text">Failed to fetch channels. Connection error.</div>';
                    }
                }
            };
            xhr.send();
        }

        // Boot
        var m3uUrl = getQueryParam('m3u');
        if (m3uUrl) {
            // Fix relative paths (m3u/world.m3u instead of ../m3u/world.m3u)
            m3uUrl = m3uUrl.replace('../', '');
            loadM3U(m3uUrl);
        } else {
            // Default to loading sports if nothing is chosen
            loadM3U('m3u/sport.m3u');
        }
    </script>
</body>
</html>
