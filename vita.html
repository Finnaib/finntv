<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FinnTV - Vita Player</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            height: 100%;
        }
        #header {
            background-color: #111;
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        #player-container {
            width: 100%;
            background: #000;
            text-align: center;
        }
        video {
            width: 100%;
            max-height: 40vh;
            background: #000;
        }
        #channel-list {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 10px;
            background: #1a1a1a;
            height: 400px;
        }
        .channel-item {
            padding: 15px;
            border-bottom: 1px solid #333;
            cursor: pointer;
            display: block;
            text-decoration: none;
            color: #fff;
            font-size: 16px;
        }
        .channel-item:hover, .channel-item:focus {
            background-color: #333;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #aaa;
        }
        .menu-bar {
            background: #222;
            padding: 10px;
        }
        .menu-scroll {
            overflow-x: auto;
            white-space: nowrap;
            margin-bottom: 10px;
        }
        .search-box {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            background: #333;
            color: #fff;
            border: 1px solid #444;
            border-radius: 5px;
            font-size: 16px;
        }
        .menu-btn {
            display: inline-block;
            background: #333;
            color: #fff;
            border: none;
            padding: 10px 15px;
            margin-right: 10px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }
        .menu-btn:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div id="header">
        FinnTV Vita Player
    </div>

    <div id="player-container">
        <!-- Older consoles and Vita support HTML5 video with M3U8 natively -->
        <video id="video-player" controls preload="auto"></video>
    </div>

    <div class="menu-bar" id="menu-bar">
        <div class="menu-scroll">
            <a href="vita.html?m3u=m3u/world.m3u" class="menu-btn">World</a>
            <a href="vita.html?m3u=m3u/india.m3u" class="menu-btn">India</a>
            <a href="vita.html?m3u=m3u/sport.m3u" class="menu-btn">Sports</a>
            <a href="vita.html?m3u=m3u/egypt.m3u" class="menu-btn">Egypt</a>
            <a href="vita.html?m3u=m3u/asia.m3u" class="menu-btn">Asia</a>
            <a href="vita.html?m3u=m3u/spanish.m3u" class="menu-btn">Spain</a>
        </div>
        <input type="text" id="search-input" class="search-box" placeholder="Search channels..." onkeyup="filterChannels()">
    </div>

    <div id="channel-list">
        <div class="loading">Select a playlist or load one...</div>
    </div>

    <script>
        // Using ES5 to ensure compatibility with old browsers (PS Vita, old consoles)
        var player = document.getElementById('video-player');
        var channelList = document.getElementById('channel-list');

        // Function to get query params
        function getQueryParam(name) {
            var match = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
            return match && decodeURIComponent(match[1].replace(/\+/g, ' '));
        }

            var channels = [];
            var currentName = 'Unknown';

            for (var i = 0; i < lines.length; i++) {
                var line = lines[i];
                if (line.indexOf('#EXTINF:') === 0) {
                    var parts = line.split(',');
                    if (parts.length > 1) {
                        currentName = parts.slice(1).join(',').replace(/^\s+|\s+$/g, '');

                } else if (line !== '' && line.indexOf('#') !== 0) {
                    channels.push({
        function encodeBase64(str) {
            try {
                if (typeof btoa === 'function') {
                    return btoa(unescape(encodeURIComponent(str)));
                }
            } catch (e) {
                logDebug('Base64 error: ' + e.message);
            }
            return str;
        }

        function playChannel(url) {
            try {
                var useDirect = document.getElementById('direct-play-toggle').checked;
                var finalUrl = url;
                
                if (useDirect) {
                    // Bypass proxy and force HTTP to avoid SSL errors directly
                    finalUrl = url.replace('https://', 'http://');
                    logDebug('Playing direct: ' + finalUrl);
                } else {
                    // Use PHP Proxy
                    finalUrl = 'api/stream_proxy.php?url=' + encodeURIComponent(encodeBase64(url));
                    logDebug('Playing via proxy: ' + finalUrl);
                }
                
                player.src = finalUrl;
                player.play();
            } catch(e) {
                logDebug('Play error: ' + e.message);
            }
        }

        function filterChannels() {
            try {
                var query = document.getElementById('search-input').value.toLowerCase();
                var filtered = [];
                for (var i = 0; i < allChannels.length; i++) {
                    if (allChannels[i].name.toLowerCase().indexOf(query) !== -1) {
                        filtered.push(allChannels[i]);
                    }
                }
                renderChannels(filtered);
            } catch (e) {
                logDebug('Filter error: ' + e.message);
            }
        }

        function renderChannels(channels) {
            try {
                channelList.innerHTML = '';
                if (channels.length === 0) {
                    channelList.innerHTML = '<div class="loading">No channels found.</div>';
                    return;
                }

                for (var i = 0; i < channels.length; i++) {
                    var c = channels[i];
                    var div = document.createElement('div');
                    div.className = 'channel-item';
                    div.innerHTML = c.name;
                    
                    (function(url) {
                        div.onclick = function() {
                            playChannel(url);
                        };
                    })(c.url);

                    channelList.appendChild(div);
                }
                logDebug('Rendered ' + channels.length + ' channels.');
            } catch(e) {
                logDebug('Render error: ' + e.message);
            }
        }

        function parseM3U(data) {
            try {
                var lines = data.replace(/\r/g, '').split('\n');
                var channels = [];
                var currentName = 'Unknown';

                for (var i = 0; i < lines.length; i++) {
                    var line = lines[i];
                    if (line.indexOf('#EXTINF:') === 0) {
                        var parts = line.split(',');
                        if (parts.length > 1) {
                            currentName = parts.slice(1).join(',').replace(/^\s+|\s+$/g, '');
                        }
                    } else if (line !== '' && line.indexOf('#') !== 0) {
                        channels.push({
                            name: currentName,
                            url: line.replace(/^\s+|\s+$/g, '')
                        });
                        currentName = 'Unknown';
                    }
                }
                logDebug('Parsed ' + channels.length + ' channels from M3U.');
                return channels;
            } catch(e) {
                logDebug('Parse error: ' + e.message);
                return [];
            }
        }

        function loadM3U(url) {
            logDebug('Loading playlist: ' + url);
            channelList.innerHTML = '<div class="loading">Loading channels...</div>';
            
            try {
                var xhr = new XMLHttpRequest();
                xhr.open('GET', url, true);
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        logDebug('XHR status: ' + xhr.status);
                        if (xhr.status === 200 || xhr.status === 0) {
                            if (!xhr.responseText || xhr.responseText.length === 0) {
                                logDebug('Error: Empty response from server');
                                channelList.innerHTML = '<div class="loading">Playlist is empty.</div>';
                                return;
                            }
                            allChannels = parseM3U(xhr.responseText);
                            renderChannels(allChannels);
                            if (allChannels.length > 0) {
                                playChannel(allChannels[0].url);
                            }
                        } else {
                            logDebug('HTTP Error ' + xhr.status + ' loading M3U');
                            channelList.innerHTML = '<div class="loading">Failed to load playlist. Server returned ' + xhr.status + '</div>';
                        }
                    }
                };
                xhr.send();
            } catch(e) {
                logDebug('XHR exception: ' + e.message);
                channelList.innerHTML = '<div class="loading">Network exception occurred.</div>';
            }
        }

        try {
            var m3uUrl = getQueryParam('m3u');
            if (m3uUrl) {
                m3uUrl = m3uUrl.replace('../', '');
                loadM3U(m3uUrl);
            } else {
                logDebug('Waiting for user to select a category.');
                channelList.innerHTML = '<div class="loading">Select a category from the menu above to start watching.</div>';
            }
        } catch(e) {
            logDebug('Init error: ' + e.message);
        }
    </script>
</body>
</html>
