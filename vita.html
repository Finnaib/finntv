<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FinnTV - PS Vita Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #060913; 
            color: #ffffff; 
            font-family: 'Outfit', sans-serif; 
            padding: 20px; 
            text-align: center;
        }
        .header { margin-bottom: 30px; padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo { font-size: 28px; font-weight: 800; color: #64b5f6; margin-bottom: 10px; }
        .subtitle { font-size: 14px; color: rgba(255,255,255,0.6); }

        .btn-container { max-width: 500px; margin: 0 auto; }
        .btn { 
            display: block; 
            background: linear-gradient(135deg, #1a6bb3 0%, #0d47a1 100%); 
            color: #ffffff; 
            text-decoration: none; 
            padding: 20px; 
            margin: 15px 0; 
            font-size: 18px; 
            font-weight: 600; 
            border-radius: 12px; 
            border: 1px solid rgba(255,255,255,0.2);
            transition: transform 0.2s ease;
        }
        .btn:active { transform: scale(0.98); background: #1a6bb3; }
        .btn span { font-size: 24px; vertical-align: middle; margin-right: 10px; }

        footer { margin-top: 40px; font-size: 12px; color: rgba(255,255,255,0.4); padding-bottom: 20px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">📺 FinnTV</div>
        <div class="subtitle">Premium Streaming Optimized for Vita</div>
    </div>

    <div class="btn-container">
        <a class="btn" href="player/index.html?m3u=https://finntv.vercel.app/m3u/asia.m3u"><span>🌏</span> Asia Channels</a>
        <a class="btn" href="player/index.html?m3u=https://finntv.vercel.app/m3u/egypt.m3u"><span>🇪🇬</span> Egypt Channels</a>
        <a class="btn" href="player/index.html?m3u=https://finntv.vercel.app/m3u/india.m3u"><span>🇮🇳</span> India Channels</a>
        <a class="btn" href="player/index.html?m3u=https://finntv.vercel.app/m3u/world.m3u"><span>🌐</span> World Channels</a>
        <a class="btn" href="player/index.html?m3u=https://finntv.vercel.app/m3u/indonesia.m3u"><span>🇮🇩</span> Indonesia Channels</a>
        <a class="btn" href="player/index.html?m3u=https://finntv.vercel.app/m3u/sport.m3u"><span>⚽</span> Sport Channels</a>
        
        <a class="btn" href="player/index.html" style="background: rgba(255,255,255,0.1); margin-top: 30px; font-size: 16px;">Open Web Player</a>
    </div>

    <footer>
        &copy; 2026 FinnTV • Dedicated Performance Route
    </footer>
</body>
</html>
