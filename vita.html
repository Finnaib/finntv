<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FinnTV - Vita Edition</title>
    <style>
        /* Base Reset - Flat & Fast for PS Vita */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            height: 100%;
        }

        /* Header */
        .header {
            background: #1e1e1e;
            border-bottom: 2px solid #333;
            padding: 15px;
            text-align: center;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #00ccff;
            text-transform: uppercase;
        }

        /* Settings Bar */
        .settings-bar {
            background: #252525;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #333;
        }
        .settings-label {
            font-size: 16px;
            color: #ccc;
        }
        .settings-checkbox {
            width: 20px;
            height: 20px;
            vertical-align: middle;
            margin-right: 10px;
        }

        /* Menu */
        .menu-bar {
            background: #1e1e1e;
            padding: 10px;
            text-align: center;
        }
        .menu-btn {
            display: inline-block;
            background: #333;
            color: #fff;
            text-decoration: none;
            padding: 12px 20px;
            margin: 5px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid #444;
        }
        .menu-btn.active {
            background: #0077aa;
            border-color: #00ccff;
        }

        /* Player Area */
        .player-container {
            width: 100%;
            background: #000;
            text-align: center;
            border-bottom: 2px solid #0077aa;
        }
        video {
            width: 100%;
            max-height: 350px;
            background: #000;
            display: block;
        }

        /* Pagination & Search */
        .controls-bar {
            padding: 15px;
            text-align: center;
        }
        .search-input {
            width: 90%;
            padding: 15px;
            font-size: 18px;
            background: #222;
            color: #fff;
            border: 2px solid #444;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        .page-btn {
            background: #444;
            color: #fff;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 5px;
            margin: 0 10px;
            cursor: pointer;
        }
        .page-btn:disabled {
            background: #222;
            color: #555;
        }
        .page-info {
            font-size: 16px;
            color: #aaa;
            display: inline-block;
            margin: 10px 0;
        }

        /* Channel List */
        .channel-list {
            padding: 10px;
        }
        .channel-item {
            display: block;
            padding: 20px;
            background: #1e1e1e;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 2px solid #333;
            color: #fff;
            font-size: 18px;
            text-decoration: none;
            cursor: pointer;
        }
        .channel-item:active {
            background: #0077aa;
        }
        .loading-text {
            text-align: center;
            padding: 30px;
            color: #888;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">FinnTV</div>
    </div>

    <div class="player-container">
        <video id="video-player" controls preload="none" poster="assets/poster.png"></video>
    </div>

    <div class="settings-bar">
        <label class="settings-label">
            <input type="checkbox" id="direct-play-toggle" class="settings-checkbox"> 
            Force Direct Play (Bypass Proxy)
        </label>
    </div>

    <div class="menu-bar">
        <a href="vita.html?m3u=m3u/world.m3u" class="menu-btn" id="btn-world">World</a>
        <a href="vita.html?m3u=m3u/india.m3u" class="menu-btn" id="btn-india">India</a>
        <a href="vita.html?m3u=m3u/sport.m3u" class="menu-btn" id="btn-sport">Sports</a>
        <a href="vita.html?m3u=m3u/egypt.m3u" class="menu-btn" id="btn-egypt">Egypt</a>
        <a href="vita.html?m3u=m3u/asia.m3u" class="menu-btn" id="btn-asia">Asia</a>
        <a href="vita.html?m3u=m3u/spanish.m3u" class="menu-btn" id="btn-spanish">Spain</a>
    </div>

    <div class="controls-bar">
        <input type="text" id="search-input" class="search-input" placeholder="Search channels..." onkeyup="handleSearch()">
        <br>
        <button id="btn-prev" class="page-btn" onclick="prevPage()">&#9664; Prev</button>
        <div class="page-info" id="page-info">Page 1</div>
        <button id="btn-next" class="page-btn" onclick="nextPage()">Next &#9654;</button>
    </div>

    <div class="channel-list" id="channel-list">
        <div class="loading-text">Select a category to start.</div>
    </div>

    <script>
        // STRICT ES5 + VITA OPTIMIZATION
        var player = document.getElementById('video-player');
        var channelList = document.getElementById('channel-list');
        var pageInfo = document.getElementById('page-info');
        var btnPrev = document.getElementById('btn-prev');
        var btnNext = document.getElementById('btn-next');
        var searchInput = document.getElementById('search-input');
        
        var allChannels = [];
        var filteredChannels = [];
        var currentPage = 1;
        var itemsPerPage = 50; // Prevents DOM freezing on Vita

        function getQueryParam(name) {
            var match = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
            return match && decodeURIComponent(match[1].replace(/\+/g, ' '));
        }

        function encodeBase64(str) {
            try {
                if (typeof window.btoa === 'function') {
                    return window.btoa(unescape(encodeURIComponent(str)));
                }
            } catch (e) { }
            return str;
        }

        function playChannel(url) {
            var useDirect = document.getElementById('direct-play-toggle').checked;
            var finalUrl = url;
            
            if (useDirect) {
                finalUrl = url.replace('https://', 'http://');
            } else {
                finalUrl = 'api/stream_proxy.php?url=' + encodeURIComponent(encodeBase64(url));
            }
            
            player.src = finalUrl;
            player.play();
            window.scrollTo(0, 0); // Scroll to top for player
        }

        function handleSearch() {
            var query = searchInput.value.toLowerCase();
            filteredChannels = [];
            for (var i = 0; i < allChannels.length; i++) {
                if (allChannels[i].name.toLowerCase().indexOf(query) !== -1) {
                    filteredChannels.push(allChannels[i]);
                }
            }
            currentPage = 1;
            renderPage();
        }

        function nextPage() {
            if ((currentPage * itemsPerPage) < filteredChannels.length) {
                currentPage++;
                renderPage();
            }
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderPage();
            }
        }

        function renderPage() {
            channelList.innerHTML = '';
            
            if (filteredChannels.length === 0) {
                channelList.innerHTML = '<div class="loading-text">No channels found.</div>';
                pageInfo.innerHTML = 'Page 1 of 1';
                btnPrev.disabled = true;
                btnNext.disabled = true;
                return;
            }

            var totalPages = Math.ceil(filteredChannels.length / itemsPerPage);
            pageInfo.innerHTML = 'Page ' + currentPage + ' of ' + totalPages;
            
            btnPrev.disabled = (currentPage === 1);
            btnNext.disabled = (currentPage === totalPages);

            var startIndex = (currentPage - 1) * itemsPerPage;
            var endIndex = startIndex + itemsPerPage;
            if (endIndex > filteredChannels.length) endIndex = filteredChannels.length;

            for (var i = startIndex; i < endIndex; i++) {
                var c = filteredChannels[i];
                var div = document.createElement('div');
                div.className = 'channel-item';
                div.innerHTML = c.name;
                
                // Closure for click handler
                (function(url) {
                    div.onclick = function() {
                        playChannel(url);
                    };
                })(c.url);

                channelList.appendChild(div);
            }
        }

        function parseM3U(data) {
            var lines = data.replace(/\r/g, '').split('\n');
            var channels = [];
            var currentName = 'Unknown Channel';

            for (var i = 0; i < lines.length; i++) {
                var line = lines[i];
                if (line.indexOf('#EXTINF:') === 0) {
                    var parts = line.split(',');
                    if (parts.length > 1) {
                        currentName = parts.slice(1).join(',').replace(/^\s+|\s+$/g, '');
                    }
                } else if (line !== '' && line.indexOf('#') !== 0) {
                    channels.push({
                        name: currentName,
                        url: line.replace(/^\s+|\s+$/g, '')
                    });
                    currentName = 'Unknown Channel';
                }
            }
            return channels;
        }

        function highlightActiveMenu(url) {
            var buttons = document.getElementsByClassName('menu-btn');
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].className = 'menu-btn';
                if (url && buttons[i].href.indexOf(url) !== -1) {
                    buttons[i].className = 'menu-btn active';
                }
            }
        }

        function loadM3U(url) {
            channelList.innerHTML = '<div class="loading-text">Loading channels...</div>';
            highlightActiveMenu(url);
            
            var xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200 || xhr.status === 0) {
                        if (xhr.responseText) {
                            allChannels = parseM3U(xhr.responseText);
                            filteredChannels = [].concat(allChannels);
                            currentPage = 1;
                            renderPage();
                            if (allChannels.length > 0) {
                                playChannel(allChannels[0].url);
                            }
                        } else {
                            channelList.innerHTML = '<div class="loading-text">Empty playlist.</div>';
                        }
                    } else {
                        channelList.innerHTML = '<div class="loading-text">Failed to connect to server.</div>';
                    }
                }
            };
            xhr.send();
        }

        // Init
        var m3uUrl = getQueryParam('m3u');
        if (m3uUrl) {
            m3uUrl = m3uUrl.replace('../', '');
            loadM3U(m3uUrl);
        }
    </script>
</body>
</html>
