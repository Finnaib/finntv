<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FinnTV Premium Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=9">
</head>
<body style="background-color: #060913; color: #ffffff;">
    <div class="app-container">
        <!-- Premium Navbar -->
        <div class="navbar clearfix">
            <div class="nav-logo">💎 FinnTV</div>
            <div class="nav-subtitle">Premium IPTV</div>
        </div>

        <div class="split-layout">
            <!-- Left Side: Player & Settings -->
            <div class="left-pane">
                <div class="hero-section">
                    <div class="player-wrapper">
                        <video id="video-player" controls webkit-playsinline playsinline></video>
                        <div id="player-overlay">
                            <h2 id="channel-name">Select a Stream</h2>
                            <p id="status-text">Ready for Native Playback</p>
                        </div>
                    </div>
                </div>

                <div class="action-bar">
                    <div class="search-box">
                        <input type="text" id="search-input" placeholder="🔍 Find channels...">
                    </div>
                    <div class="sync-row clearfix">
                        <div class="sync-input-wrapper">
                            <input type="text" id="m3u-url" placeholder="Your M3U Link..." value="https://iptv-org.github.io/iptv/index.m3u">
                        </div>
                        <button id="load-btn">Load</button>
                    </div>
                </div>
                
                <div class="left-footer-info">
                    <p>Designed for PS Vita & Mobile.</p>
                </div>
            </div>

            <!-- Right Side: Channel List -->
            <div class="right-pane">
                <div class="content-section">
                    <div class="section-header clearfix">
                        <h3 class="section-title">Live TV</h3>
                        <span class="channel-badge" id="channel-count">0</span>
                    </div>
                    
                    <div id="channel-list" class="channel-grid">
                        <div class="message">
                            <div class="message-icon">📡</div>
                            Paste your M3U link to load<br>your premium channel grid.
                        </div>
                    </div>
                    
                    <div id="pagination-container"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Ensure Vita compatibility by keeping JS light -->
    <script src="app.js?v=9"></script>
</body>
</html>
