<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script>
        var isVita = navigator.userAgent.indexOf('Vita') !== -1 || navigator.userAgent.indexOf('PlayStation') !== -1;
        if (isVita) {
            document.write('<meta name="viewport" content="width=640, user-scalable=yes">');
        } else {
            document.write('<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">');
        }
    </script>
    <title>FinnTV Premium Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <!-- HLS.js for manifests (.m3u8) -->
    <script>
        var isVita = navigator.userAgent.indexOf('Vita') !== -1 || navigator.userAgent.indexOf('PlayStation') !== -1;
        if (!isVita) {
            document.write('<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"><\/script>');
            document.write('<script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.min.js"><\/script>');
        }
    </script>
    <link rel="stylesheet" href="style.css?v=57">
</head>

<body>
    <div class="navbar clearfix">
        <div class="nav-logo">FinnTV <span>Premium </span></div>
        <div class="channel-badge"><span id="channel-count">0</span> Channels</div>
    </div>

        <div class="split-layout">
            <!-- Video Player (Order swapped to show at top on mobile) -->
            <div class="right-pane">
                <div class="hero-section">
                    <div class="player-wrapper">
                        <video id="video-player" controls preload="auto" playsinline webkit-playsinline x-webkit-airplay="allow"></video>
                        <div id="player-overlay">
                            <h1 id="channel-name">FinnTV Premium</h1>
                            <div id="status-text">Ready to stream</div>
                        </div>
                    </div>
                </div>

                <div class="sync-row clearfix">
                    <div class="sync-input-wrapper">
                        <input type="text" id="m3u-url" placeholder="Paste .m3u link"
                            value="https://iptv-org.github.io/iptv/index.m3u">
                    </div>
                    <button id="load-btn">Load</button>
                </div>

                <div class="app-info">
                    Designed for PS Vita & Mobile.
                </div>
            </div>

            <!-- Channel Guide -->
            <div class="left-pane">
                <div class="group-filter-bar clearfix" id="group-filter"></div>
                <div class="action-bar clearfix">
                    <div class="search-box">
                        <input type="text" id="search-input" placeholder="Find channels...">
                    </div>
                </div>

                <div class="content-section">
                    <div class="section-header clearfix">
                        <h2 class="section-title">Channel Guide</h2>
                    </div>
                    <div class="channel-grid" id="channel-list">
                        <div id="pagination-container"></div>
                    </div>
                </div>
            </div>
        </div>

    <!-- Ensure Vita compatibility by keeping JS light -->
    <script src="app.js?v=25"></script>
</body>

</html>
