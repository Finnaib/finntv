<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FinnTV Player</title>
    <!-- Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=6">
</head>
<body style="background-color: #050814; color: #ffffff;">
    <div class="app-container">
        
        <!-- Ultra-Thin Navbar for Small Screens -->
        <div class="navbar">
            <div class="nav-logo">📺 FinnTV Player</div>
        </div>

        <!-- Premium Video Player Area (Resized for 544p screens) -->
        <div class="hero-section">
            <div class="player-wrapper">
                <video id="video-player" controls webkit-playsinline playsinline></video>
                <div id="player-overlay">
                    <h2 id="channel-name">Select a Stream</h2>
                    <p id="status-text">Ready for Native Playback</p>
                </div>
            </div>
        </div>

        <!-- Action Bar (Search & Sync) -->
        <div class="action-bar">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="🔍 Search channels...">
            </div>
            <div class="sync-box">
                <input type="text" id="m3u-url" placeholder="Paste .m3u link here..." value="https://iptv-org.github.io/iptv/index.m3u">
                <button id="load-btn">Sync</button>
            </div>
            <div style="clear: both;"></div>
        </div>

        <!-- Modern Grid layout for channels -->
        <div class="content-section">
            <h3 class="section-title">Live Channels (<span id="channel-count">0</span>)</h3>
            
            <div id="channel-list" class="channel-grid">
                <div class="message">Paste your M3U link to load your premium channel grid.</div>
            </div>
            
            <div style="clear: both;"></div>
            
            <div id="pagination-container"></div>
        </div>
    </div>

    <!-- Ensure Vita compatibility by keeping JS light -->
    <script src="app.js?v=7"></script>
</body>
</html>
