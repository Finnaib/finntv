<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FinnTV Player</title>
    <link rel="stylesheet" href="style.css?v=final_zero">
</head>
<body>
    <div class="v-nav"><div class="v-logo">FinnTV Premium</div></div>
    <div class="v-main">
        <div class="v-player">
            <video id="video-player" controls playsinline></video>
            <div class="ch-overlay" id="channel-name">Select Stream</div>
        </div>
        <div class="v-sidebar">
            <div class="v-search-bar"><input type="text" id="search-input" placeholder="Search Channels..."></div>
            <div id="channel-list" class="v-scroller"></div>
            <div class="v-load-box" id="pagination-container"></div>
        </div>
    </div>
    <script src="app.js?v=final_zero"></script>
</body>
</html>
